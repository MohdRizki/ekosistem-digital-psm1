    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { initializeFirestore, collection, doc, setDoc, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 1. FIREBASE CONFIG ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' && __firebase_config ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyBL7-vUv3Kqcpxjaq_6AWGgFFirc7p-jhs",
            authDomain: "sd-negeri-pasirmae-1.firebaseapp.com",
            projectId: "sd-negeri-pasirmae-1",
            appId: "1:19037387384:web:f396f39545f54ac7818b8d"
        };
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sd-negeri-pasirmae-1'; 
        const hubUrl = "https://mohdrizki.github.io/";
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = initializeFirestore(app, { experimentalForceLongPolling: true });

        // --- GLOBAL HELPER ---
        window.cleanKelas = (val) => {
            if (!val) return '1';
            let str = String(val).trim().replace(/^(Kelas|Rombel|Grade|Kls|Level|Tingkat)\s*/i, '').trim().toUpperCase();
            if (/^6|^VI/i.test(str) || str.includes('6')) return '6';
            if (/^4|^IV/i.test(str) || str.includes('4')) return '4';
            if (/^5|^V/i.test(str) || str.includes('5')) return '5';
            if (/^3|^III/i.test(str) || str.includes('3')) return '3';
            if (/^2|^II/i.test(str) || str.includes('2')) return '2';
            if (/^1|^I/i.test(str) || str.includes('1')) return '1';
            const digits = str.replace(/[^0-9]/g, '');
            return digits || '1';
        };

        window.getDayName = (dateStr) => {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.toLocaleDateString('id-ID', { weekday: 'long' });
        };

        window.isHoliday = (dateStr) => {
            if (!dateStr) return false;
            const date = new Date(dateStr);
            const isSunday = date.getDay() === 0;
            const isNationalHoliday = window.appState.holidays.some(h => h.tanggal === dateStr);
            return isSunday || isNationalHoliday;
        };

        window.getHolidayDescription = (dateStr) => {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const holiday = window.appState.holidays.find(h => h.tanggal === dateStr);
            if (holiday) return holiday.keterangan;
            if (date.getDay() === 0) return 'Libur Akhir Pekan';
            return '';
        };

        // --- AUDIO HELPERS ---
        window.playBeep = () => {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.value = 880; // Nada A5
            gain.gain.value = 0.1;
            osc.start();
            setTimeout(() => osc.stop(), 150);
        };

        // Pre-load voices for TTS
        let availableVoices = [];
        const loadVoices = () => {
            availableVoices = window.speechSynthesis.getVoices();
        };
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        window.speakText = (text) => {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            
            // Try to find Indonesian voice
            if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();
            const idVoice = availableVoices.find(v => v.lang === 'id-ID' || v.lang === 'id_ID');
            if (idVoice) utterance.voice = idVoice;
            
            // Fallback to beep if error
            utterance.onerror = (e) => {
                console.warn('TTS Error:', e);
                window.playBeep();
            };
            
            window.speechSynthesis.speak(utterance);
        };

        // --- 2. GLOBAL STATE ---
        window.appState = {
            currentView: 'dashboard',
            user: null,
            teacherId: null, 
            loading: true,
            isAuthenticated: false,
            isLoggingIn: false,
            isScannerStarting: false,
            loginError: '',
            settings: { 
                nama_guru: '', nip_guru: '', nama_sekolah: '', nama_kepsek: '', nip_kepsek: '', lokasi: '', semester: '1', tahun_ajaran: '2024/2025', kelas_diampu: [], 
                voiceMode: 'tts' 
            },
            students: [],
            journals: [],
            attendance: [], 
            mapels: [],
            holidays: [],
            selectedKelas: '', 
            selectedMapel: '',
            selectedDate: new Date().toISOString().split('T')[0],
            reportMonth: new Date().toISOString().slice(0, 7),
            historyMonth: new Date().toISOString().slice(0, 7),
            reportSearch: '',
            attendanceSearch: '',
            reportViewType: 'rekap', 
            lastFocusedId: null,
            lastCaretPos: 0,
            mobileMenuOpen: false,
            sidebarCollapsed: false, 
            populationExpanded: false,
            scannerActive: false,
            html5QrCode: null,
            cameraFacingMode: "user", 
            modal: { show: false, title: '', message: '', onConfirm: null },
            qrModal: { show: false, student: null },
            editModal: { show: false, id: null, name: '' },
            // NEW: MODAL UNTUK EDIT IZIN BERJANGKA
            longTermEditModal: { show: false, studentId: null, date: null, type: '' },
            scannerLock: false,
            scanSuccessPopup: { show: false, studentName: '' },
            lastScans: {},
            
            // --- STATE PRESENSI MANUAL ---
            finishStep: 0, 
            missingStudentsCache: []
        };

        // UPDATED: Menu Names V2
        const viewTitles = {
            'dashboard': 'Beranda',
            'scanner': 'Scan QR Presensi',
            'input': 'Isi Jurnal Harian',
            'mapel': 'Mata Pelajaran',
            'history': 'Riwayat Jurnal',  // Changed from Riwayat
            'reports': 'Laporan Presensi', // Changed from Laporan
            'students': 'Pengelolaan Siswa',
            'holidays': 'Izin & Hari Libur',
            'settings': 'Pengaturan Sistem',
            'info': 'Tentang Aplikasi'
        };

        // --- 3. UI HELPERS ---
        window.showNotif = (msg, tipe = 'success') => {
            const wadah = document.getElementById('notif-anchor');
            if (!wadah) return;
            const kotak = document.createElement('div');
            kotak.className = `bg-surface border-l-4 ${tipe === 'error' ? 'border-rose-500 text-error' : 'border-blue-600 text-primary'} shadow-xl rounded-2xl p-4 animate-slideDown flex items-center gap-3 pointer-events-auto mb-2 w-72 z-[99999] text-left transition-all`;
            kotak.innerHTML = `<i class="ph-bold ph-info"></i> <span class="text-xs font-semibold tracking-tight">${msg}</span>`;
            wadah.appendChild(kotak);
            setTimeout(() => { kotak.style.opacity='0'; setTimeout(()=>kotak.remove(), 400); }, 3000);
        };

        window.confirmAction = (title, message, onConfirm) => {
            window.appState.modal = { show: true, title, message, onConfirm };
            window.renderOverlays();
        };

        // --- NEW: LOGIKA ALUR SELESAIKAN PRESENSI ---
        window.initFinishAttendance = async () => {
            await window.stopScanner();
            const allStudents = window.appState.students.filter(s => String(s.kelas) === String(window.appState.selectedKelas));
            const presentIds = window.appState.attendance
                .filter(a => a.date === window.appState.selectedDate && String(a.studentClass) === String(window.appState.selectedKelas))
                .map(a => a.studentId);
            window.appState.missingStudentsCache = allStudents
                .filter(s => !presentIds.includes(s.id))
                .sort((a, b) => a.nama_siswa.localeCompare(b.nama_siswa)); 
            window.appState.finishStep = 1; 
            window.renderOverlays(); 
        };

        window.goToFinishList = () => { window.appState.finishStep = 2; window.renderOverlays(); };

        window.markManualQuick = async (id, status) => {
            const rowEl = document.getElementById(`manual-row-${id}`);
            if (rowEl) { rowEl.style.transition = "all 0.3s ease"; rowEl.style.opacity = "0"; rowEl.style.transform = "translateX(50px)"; setTimeout(() => rowEl.remove(), 300); }
            await window.markAttendance(id, status);
            window.appState.missingStudentsCache = window.appState.missingStudentsCache.filter(s => s.id !== id);
            const countEl = document.getElementById('manual-remaining-count');
            if (countEl) countEl.textContent = `${window.appState.missingStudentsCache.length} Sisa`;
            if (window.appState.missingStudentsCache.length === 0) {
                const listContainer = document.getElementById('manual-confirm-list');
                if (listContainer) setTimeout(() => { listContainer.innerHTML = '<p class="text-center text-xs text-textSecondary font-bold py-10 animate-fadeIn">Seluruh siswa telah tercatat kehadirannya.</p>'; }, 300);
            }
        };

        window.finishAttendanceProcess = () => { window.appState.finishStep = 3; window.renderOverlays(); };

        window.confirmJournal = (yes) => {
            if (yes) { window.appState.finishStep = 0; window.renderOverlays(); window.setView('input'); } 
            else { window.appState.finishStep = 4; window.renderOverlays(); }
        };

        window.closeFinishAttendance = () => { window.appState.finishStep = 0; window.renderOverlays(); window.setView('dashboard'); };

        // --- NEW: HANDLING IZIN JANGKA PANJANG & EDIT ---
        window.handleSaveLongTerm = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const studentId = formData.get('studentId');
            const startDate = new Date(formData.get('startDate'));
            const endDate = new Date(formData.get('endDate'));
            const status = formData.get('status');
            const note = formData.get('note');

            if (!studentId || !startDate || !endDate) return window.showNotif("Mohon lengkapi data", "error");
            if (startDate > endDate) return window.showNotif("Tanggal akhir harus setelah tanggal awal", "error");

            const student = window.appState.students.find(s => s.id === studentId);
            if(!student) return;

            window.showNotif("Menyimpan data...");
            const batch = writeBatch(db);
            let loopDate = new Date(startDate);

            while(loopDate <= endDate) {
                const dateStr = loopDate.toISOString().split('T')[0];
                if (loopDate.getDay() !== 0) { // Skip Minggu
                     const existing = window.appState.attendance.find(a => a.studentId === studentId && a.date === dateStr);
                     const attRef = existing 
                        ? doc(db, 'artifacts', appId, 'users', window.appState.teacherId, 'attendance', existing.id)
                        : doc(collection(db, 'artifacts', appId, 'users', window.appState.teacherId, 'attendance'));
                     
                     batch.set(attRef, {
                        studentId: studentId,
                        studentName: student.nama_siswa,
                        studentClass: student.kelas,
                        date: dateStr,
                        status: status,
                        note: note || '',
                        timestamp: new Date().toISOString(),
                        semester: window.appState.settings.semester
                     }, { merge: true });
                }
                loopDate.setDate(loopDate.getDate() + 1);
            }
            
            await batch.commit();
            window.showNotif("Izin/Sakit Berhasil Disimpan");
            e.target.reset();
            window.renderApp(); // Refresh view to show updated data
        };

        // Fungsi Hapus Izin Per Tanggal (bukan range, karena di DB disimpan per hari)
        window.deleteAttendanceDay = (attId) => {
            window.confirmAction("Hapus Izin", "Yakin ingin menghapus status izin/sakit siswa pada tanggal ini?", async () => {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', window.appState.teacherId, 'attendance', attId));
                window.showNotif("Status Dihapus");
                window.appState.modal.show = false;
                window.renderOverlays();
                window.renderApp();
            });
        };

        // --- 4. FIREBASE LISTENERS ---
        window.initDataListeners = () => {
            if (!auth.currentUser || !window.appState.teacherId) return;
            const tId = window.appState.teacherId;
            const userRef = (col) => collection(db, 'artifacts', appId, 'users', tId, col);
            const profileRef = doc(db, 'artifacts', appId, 'public', 'data', 'guru', tId);
            
            // Ecosystem & Local: Students (Merge both global public siswa and teacher's local students, filtered by kelas diampu)
            window.publicStudentsList = window.publicStudentsList || [];
            window.localStudentsList = window.localStudentsList || [];
            
            const mergeAndRenderStudents = () => {
                const combined = [...window.publicStudentsList];
                window.localStudentsList.forEach(ls => {
                    if (!combined.some(ps => ps.id === ls.id || (ps.nama_siswa && ls.nama_siswa && ps.nama_siswa.toLowerCase().trim() === ls.nama_siswa.toLowerCase().trim()))) {
                        combined.push(ls);
                    }
                });
                const diampu = (window.appState.settings.kelas_diampu || ['1', '2', '3', '4', '5', '6']).map(k => window.cleanKelas(k));
                const filtered = combined.filter(s => diampu.includes(window.cleanKelas(s.kelas)));
                window.appState.students = filtered;
                if (!window.appState.selectedKelas || !diampu.includes(window.cleanKelas(window.appState.selectedKelas))) {
                    window.appState.selectedKelas = diampu[0] || (window.appState.students[0] ? window.cleanKelas(window.appState.students[0].kelas) : '1');
                }
                window.renderApp();
            };

            onSnapshot(profileRef, (snap) => { 
                if (snap.exists()) { 
                    const d = snap.data();
                    const rawDiampu = d.kelas_diampu || (d.kelas ? [d.kelas] : ['1', '2', '3', '4', '5', '6']);
                    const diampuClean = (Array.isArray(rawDiampu) ? rawDiampu : [rawDiampu]).map(k => window.cleanKelas(k));
                    window.appState.settings = { 
                        ...window.appState.settings, 
                        ...d,
                        nama_guru: d.nama || d.nama_guru || '',
                        kelas_diampu: diampuClean.length > 0 ? diampuClean : ['1', '2', '3', '4', '5', '6']
                    }; 
                    if (!window.appState.selectedKelas || window.appState.selectedKelas === '') {
                        window.appState.selectedKelas = window.appState.settings.kelas_diampu[0] || '1';
                    }
                    window.appState.selectedKelas = window.cleanKelas(window.appState.selectedKelas) || '1';
                    mergeAndRenderStudents(); 
                } 
            });

            const userSettingsRef = doc(db, 'artifacts', appId, 'users', tId, 'settings', 'profile');
            onSnapshot(userSettingsRef, (snap) => {
                if (snap.exists()) {
                    const d = snap.data();
                    const rawDiampu = d.kelas_diampu || window.appState.settings.kelas_diampu || ['1', '2', '3', '4', '5', '6'];
                    const diampuClean = (Array.isArray(rawDiampu) ? rawDiampu : [rawDiampu]).map(k => window.cleanKelas(k));
                    window.appState.settings = {
                        ...window.appState.settings,
                        ...d,
                        kelas_diampu: diampuClean.length > 0 ? diampuClean : ['1', '2', '3', '4', '5', '6']
                    };
                    if (!window.appState.selectedKelas || !diampuClean.includes(window.cleanKelas(window.appState.selectedKelas))) {
                        window.appState.selectedKelas = diampuClean[0] || '1';
                    }
                    mergeAndRenderStudents();
                }
            });

            const publicSiswaRef = collection(db, 'artifacts', appId, 'public', 'data', 'siswa');
            onSnapshot(publicSiswaRef, (snap) => { 
                window.publicStudentsList = snap.docs.map(d => {
                    const data = d.data();
                    const numKelas = window.cleanKelas(data.kelas || data.rombel || data.rombel_saat_ini || data.tingkat || "");
                    return { ...data, id: d.id, nama_siswa: data.nama || data.nama_siswa || "Siswa", kelas: numKelas, jk: data.jk || '', nisn: data.nisn || '' };
                });
                mergeAndRenderStudents(); 
            });

            onSnapshot(userRef('students'), (snap) => {
                window.localStudentsList = snap.docs.map(d => {
                    const data = d.data();
                    const numKelas = window.cleanKelas(data.kelas || data.rombel || data.rombel_saat_ini || data.tingkat || "");
                    return { ...data, id: d.id, nama_siswa: data.nama || data.nama_siswa || "Siswa", kelas: numKelas, jk: data.jk || '', nisn: data.nisn || '' };
                });
                mergeAndRenderStudents();
            });
            
            // Ecosystem: Mapels (Subjects)
            const globalSettingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global');
            onSnapshot(globalSettingsRef, (snap) => {
                if (snap.exists() && snap.data().subjects) {
                    const subjects = snap.data().subjects;
                    // Jurnal expects mapels with 'nama' and 'tp' arrays. We'll map them per kelas_diampu so the UI doesn't break.
                    const diampu = window.appState.settings.kelas_diampu || [];
                    let newMapels = [];
                    diampu.forEach(k => {
                        subjects.forEach(sub => {
                            newMapels.push({ id: `global_${k}_${sub.id}`, nama: sub.label, kelas: k, tp: [] });
                        });
                    });
                    // Merge with custom mapels from teacher to preserve custom TP
                    const customMapels = window.appState.mapels.filter(m => !m.id.startsWith('global_'));
                    window.appState.mapels = [...newMapels, ...customMapels];
                    window.renderApp();
                }
            });

            onSnapshot(userRef('journals'), (snap) => { window.appState.journals = snap.docs.map(d => ({ id: d.id, ...d.data() })); window.renderApp(); });
            onSnapshot(userRef('attendance'), (snap) => { 
                window.appState.attendance = snap.docs.map(d => ({ id: d.id, ...d.data() })); 
                if (window.appState.finishStep !== 2) { window.renderApp(); }
            });
            // Keep custom mapels listener
            onSnapshot(userRef('mapels'), (snap) => { 
                const customMapels = snap.docs.map(d => ({ id: d.id, ...d.data() })); 
                const globalMapels = window.appState.mapels.filter(m => m.id.startsWith('global_'));
                
                // Overwrite TP if custom mapel has the same name and class as global mapel
                globalMapels.forEach(gm => {
                    const matchingCustom = customMapels.find(cm => cm.nama === gm.nama && String(cm.kelas) === String(gm.kelas));
                    if (matchingCustom && matchingCustom.tp) {
                        gm.tp = matchingCustom.tp;
                    }
                });
                
                window.appState.mapels = [...globalMapels, ...customMapels.filter(cm => !globalMapels.some(gm => gm.nama === cm.nama && String(gm.kelas) === String(cm.kelas)))];
                window.renderApp(); 
            });
            onSnapshot(userRef('holidays'), (snap) => { window.appState.holidays = snap.docs.map(d => ({ id: d.id, ...d.data() })); window.renderApp(); });
        };

        // --- 5. AUTH ---
        window.handleLogin = async (e) => {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim().toLowerCase();
            const p = document.getElementById('login-pin').value.trim();
            if(!u || !p) { window.showNotif("Username dan PIN wajib diisi!", "error"); return; }
            
            window.appState.isLoggingIn = true;
            const btn = e.target.querySelector('button[type="submit"]');
            const originalBtnHtml = btn.innerHTML;
            if(btn) { btn.innerHTML = '<i class="ph-bold ph-spinner-gap animate-spin mr-2"></i> Memeriksa...'; btn.classList.add('opacity-75', 'cursor-wait'); btn.disabled = true; }
            
            try {
                const guruRef = collection(db, 'artifacts', appId, 'public', 'data', 'guru');
                const snap = await getDocs(guruRef);
                let matchedGuru = null;
                
                snap.forEach(doc => {
                    const data = doc.data();
                    if ((data.username || "").toLowerCase() === u && data.pin === p) {
                        matchedGuru = { id: doc.id, ...data };
                    }
                });
                
                if (matchedGuru) {
                    window.appState.teacherId = matchedGuru.id; 
                    window.appState.user = matchedGuru;
                    const numKelas = window.cleanKelas(matchedGuru.kelas || "");
                    const rawDiampu = matchedGuru.kelas_diampu || (numKelas ? [numKelas] : ['1', '2', '3', '4', '5', '6']);
                    const diampuClean = (Array.isArray(rawDiampu) ? rawDiampu : [rawDiampu]).map(k => window.cleanKelas(k));
                    // Auto update settings based on matchedGuru
                    window.appState.settings = {
                        ...window.appState.settings,
                        nama_guru: matchedGuru.nama || matchedGuru.username,
                        nip_guru: matchedGuru.nip || '',
                        kelas_diampu: diampuClean.length > 0 ? diampuClean : ['1', '2', '3', '4', '5', '6']
                    };
                    window.appState.selectedKelas = diampuClean[0] || numKelas || '1';
                    
                    window.appState.isAuthenticated = true; 
                    
                    // Set 1-day session
                    const expireTime = Date.now() + (24 * 60 * 60 * 1000);
                    localStorage.setItem('jurnalSessionInfo', JSON.stringify({ matchedGuru, expiresAt: expireTime }));

                    window.initDataListeners(); 
                    window.setView('dashboard');
                } else { 
                    window.showNotif("Username atau PIN Salah!", "error"); 
                    window.appState.isLoggingIn = false; 
                    if(btn) { btn.innerHTML = originalBtnHtml; btn.classList.remove('opacity-75', 'cursor-wait'); btn.disabled = false; }
                    window.renderApp(); 
                }
            } catch (err) { 
                console.error(err);
                window.appState.loginError = "Gagal Verifikasi"; 
                window.appState.isLoggingIn = false; 
                if(btn) { btn.innerHTML = originalBtnHtml; btn.classList.remove('opacity-75', 'cursor-wait'); btn.disabled = false; }
                window.renderApp(); 
            }
        };const originalHandleLogout = window.handleLogout;

        window.handleLogout = async () => {
            await window.stopScanner();
            localStorage.removeItem('jurnalSessionInfo');
            window.appState.isAuthenticated = false; window.appState.teacherId = null; window.appState.selectedKelas = '';

nce[i];\n        rowsAtt.push([a.studentId || "", a.studentName || "", a.studentClass || "", a.date || "", a.status || "", a.semester || "", a.timestamp || ""]);\n      }\n      sheetAtt.getRange(1, 1, rowsAtt.length, headersAtt.length).setValues(rowsAtt);\n      formatHeader(sheetAtt, headersAtt.length);\n    }\n    if (data.students && data.students.length > 0) {\n      var sheetSiswa = getOrCreateSheet(ss, "Data Siswa");\n      sheetSiswa.clear();\n      var headersSiswa = ["ID", "NISN", "NIS", "Nama Siswa", "Kelas", "L/P", "Status"];\n      var rowsSiswa = [headersSiswa];\n      for (var i = 0; i < data.students.length; i++) {\n        var s = data.students[i];\n        rowsSiswa.push([s.id || "", s.nisn || "", s.nis || "", s.nama_siswa || "", s.kelas || "", s.jenis_kelamin || "", s.status || "Aktif"]);\n      }\n      sheetSiswa.getRange(1, 1, rowsSiswa.length, headersSiswa.length).setValues(rowsSiswa);\n      formatHeader(sheetSiswa, headersSiswa.length);\n    }\n    return ContentService.createTextOutput(JSON.stringify({ status: "success" })).setMimeType(ContentService.MimeType.JSON);\n  } catch(err) {\n    return ContentService.createTextOutput(JSON.stringify({ status: "error", message: err.toString() })).setMimeType(ContentService.MimeType.JSON);\n  }\n}\n\nfunction getOrCreateSheet(ss, name) {\n  var sheet = ss.getSheetByName(name); if (!sheet) sheet = ss.insertSheet(name); return sheet;\n}\n\nfunction formatHeader(sheet, colCount) {\n  var range = sheet.getRange(1, 1, 1, colCount);\n  range.setBackground("#2563eb"); range.setFontColor("#ffffff"); range.setFontWeight("bold"); sheet.setFrozenRows(1);\n  for (var c = 1; c <= colCount; c++) sheet.autoResizeColumn(c);\n}`;
